# Dependabot (review A2): bewaakt npm-deps én GitHub-Actions op bekende
# kwetsbaarheden en versie-drift. Het github-actions-ecosysteem houdt tevens de
# SHA-pins in de workflows bij (review G1).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Dit is een **managed Expo-app (SDK 56)**: de React-Native-/Expo-runtime-deps
    # worden door de Expo SDK gepind en horen via `expo install` / een SDK-upgrade
    # gebumpt te worden — niet los via dependabot. Losse bumps breken de SDK-lockstep
    # (reanimated/worklets/react-dom faalden aantoonbaar de CI). Major-bumps van de
    # overige deps surfacen we ook niet automatisch (eerst bewust beoordelen).
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Skill-subdependency buiten de hoofd-lockfile (review C2): @resvg/resvg-js.
  - package-ecosystem: "npm"
    directory: "/.claude/skills/svg-illustraties/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
