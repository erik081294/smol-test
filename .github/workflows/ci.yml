name: CI

# Draait de unit-tests bij elke push en PR. De RLS-integratietests slaan
# zichzelf over zolang er geen Supabase-secrets zijn ingesteld (zie hieronder),
# zodat de build niet faalt op forks of zonder gekoppeld testproject.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege workflow-token (review G2): tests + lint hebben enkel leestoegang nodig.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions zijn SHA-gepind (review G1); Dependabot github-actions houdt de pins bij.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit (niet-blokkerend)
        # Meldt bekende kwetsbaarheden (>= high) zonder de build te breken (review A2).
        # Maak dit later eventueel blokkerend zodra de baseline schoon is (backlog A2b).
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        # Faalt alleen op errors (o.a. no-undef / react/jsx-no-undef) — het vangnet
        # dat een bug als "nl is not defined" vóór runtime tegenhoudt. De nieuwe
        # React-compiler-regels staan bewust op "warn" (zie eslint.config.js).
        run: npx eslint .

      - name: Typecheck
        # Opt-in type-laag (// @ts-check) over de pure logica-modules, gescoped via
        # tsconfig.check.json. Vangt verkeerde shapes/arg-fouten vóór de tests.
        # Goedkoop-dan-duur: enkele seconden, dus vóór de (tragere) testsuite.
        run: npm run typecheck

      - name: Tests
        # BEWUST géén Supabase-secrets hier (review P3, tests-medium): met de secrets zou
        # `npm test` de RLS-integratietest op ÉLKE push/PR tegen het live project draaien —
        # zonder concurrency-groep, in directe tegenspraak met rls-check.yml (dat dit juist
        # geserialiseerd + bewust triggert). Zonder de env-vars skipt de RLS-test zichzelf
        # (de ENABLED-gate in tests/rls.integration.test.js); de pure suite draait wél.
        # RLS-verificatie leeft exclusief in rls-check.yml.
        run: npm test
