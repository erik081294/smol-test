name: OFF catalogus delta-refresh

# Houdt de globale productcatalogus (catalog_products) vers met OFF's DAGELIJKSE delta's
# (incrementeel, idempotent — zie scripts/refresh-off-delta.mjs). Draait alleen als de
# Supabase-secrets zijn ingesteld; zonder secret is het een bewuste no-op (geen faal-ruis).
#
# De periodieke VOLLE her-import (die ook verwijderingen opschoont; delta's kunnen dat niet)
# blijft een handmatige stap — zie docs/off-catalog.md.
on:
  schedule:
    - cron: '17 4 * * *' # elke dag 04:17 UTC
  workflow_dispatch: {} # handmatig te starten

# Least-privilege workflow-token (review G2).
permissions:
  contents: read

concurrency:
  group: off-catalog-refresh
  cancel-in-progress: false

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      # Actions zijn SHA-gepind (review G1); Dependabot github-actions houdt de pins bij.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Delta-refresh
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Geen SUPABASE_SERVICE_ROLE_KEY-secret ingesteld — delta-refresh overgeslagen (no-op)."
            exit 0
          fi
          node scripts/refresh-off-delta.mjs
