# Kritieke flow 4: veeg-actie op een taak (UX-17) — links vegen = verwijderen.
# Start op de tabbalk (ingelogd test-huishouden). Zie .maestro/README.md.
#
# Op toestel geverifieerd (Motorola moto_g72). Let op bij handmatig adb-testen: `adb input
# swipe` moet traag genoeg zijn (~1200ms) om de gesture-handler te triggeren; een snelle
# fling komt niet aan. Maestro `swipe` doet dit zelf goed.
#
# Bewust zónder undo-tik: de undo-toast verdwijnt na een paar seconden en Maestro's
# veeg→zoek→tik-cyclus haalt dat venster niet betrouwbaar (flakete in de volledige suite).
# We bewijzen de veeg via de "verwijderd"-toast en laten de taak dán ook echt verwijderen
# → geen testresidue. De undo-terugdraai is gedekt door 03-boodschap-undo (STR-9); de
# rechts-veeg (uitstellen) deelt dezelfde SwipeRow-gesture en wordt handmatig gedekt.
appId: app.huishoek
---
# Géén launchApp (opent de dev-client-launcher); de runner cold-laadt de app.
- tapOn:
    id: "t-tab-taken"                    # tab
- assertVisible: "Taken"                 # scherm-titel

# Maak een verse taak om op te vegen (datum staat al op vandaag).
- tapOn:
    id: "t-fab-task"                     # FAB (task.add)
- assertVisible: "Nieuwe afspraak"       # task.new (editor-titel)
- tapOn:
    id: "t-field-title"                  # titel-veld (task.field.title)
- inputText: "E2E veeg taak"
- tapOn:
    id: "t-save"                         # ModalHeader bevestigen (common.save)
# Ruime wachttijd: de lijst herlaadt async na de DB-insert; te vroeg asserten flaket.
- extendedWaitUntil:
    visible: "E2E veeg taak"
    timeout: 15000

# Links vegen = verwijderen → de "verwijderd"-toast bewijst dat de veeg-gesture vuurde.
# Geen undo → de taak wordt na het verlopen van de toast echt verwijderd (self-clean).
- swipe:
    from:
      text: "E2E veeg taak"
    direction: LEFT
- assertVisible: ".*verwijderd"          # tasks.deleted (regex)
- assertNotVisible:
    id: "t-error-boundary"
