# Kritieke flow 3: boodschap toevoegen → verwijderen (veeg links) → ongedaan maken (STR-9 undo).
# Start op de tabbalk (ingelogd test-huishouden). Zie .maestro/README.md.
# Let op: een boodschap-rij heeft géén losse delete-knop — verwijderen gaat via naar-links
# vegen (app-conventie, zie SwipeRow in lib/ui.js). Maestro's `swipe` triggert de gesture goed.
appId: app.huishoek
---
# Géén launchApp (opent de dev-client-launcher); de runner cold-laadt de app.
- tapOn:
    id: "t-tab-boodschappen"
- tapOn:
    id: "t-grocery-add"                  # invoerveld (groceries.addLabel)
- inputText: "E2E rooktest melk"
- pressKey: Enter
# Ruime wachttijd: de lijst herlaadt async na de DB-insert.
- extendedWaitUntil:
    visible: "E2E rooktest melk"
    timeout: 15000
# Verwijderen: naar links vegen = de destructieve actie (undo-toast verschijnt).
# Tik "Ongedaan maken" DIRECT na de veeg (geen tussen-assert die een trage UI-dump kost),
# anders is de toast al weg — zie de timing-notitie in 04-swipe.yaml.
- swipe:
    from:
      text: "E2E rooktest melk"
    direction: LEFT
- tapOn: "Ongedaan maken"                # common.undo (undo-toast) — STR-9
- assertVisible: "E2E rooktest melk"     # item komt terug
# Opruimen van de `E2E…`-rij gebeurt op DB-niveau door de runner (scripts/rooktest-cleanup.mjs).
- assertNotVisible:
    id: "t-error-boundary"
