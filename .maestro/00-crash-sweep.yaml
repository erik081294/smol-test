# Crash-sweep (INF-3): boot élk hoofdscherm en assert dat er geen render-fout valt.
# Het snelste net voor "draait alles, crasht niets" — puur op de werking, geen inhoud.
#
# Werking: navigeer naar elke tab (primair via de balk, de rest via "Meer") en
# assert na elke stap dat de error-boundary-fallback NIET zichtbaar is
# (id=t-error-boundary uit lib/ErrorBoundary.js). Een leeg/hangend scherm valt ook
# op omdat we op een bekend anker (scherm-titel) asserten.
#
# Selectors op id (t-tab-<key>, gezet in app/(tabs)/_layout.js via tabBarButtonTestID)
# zodat de sweep niet breekt als een tab-label verandert. Deze flow gaat uit van een
# ingelogd test-huishouden met álle modules aan (default-on); staat een module uit,
# dan is z'n regel in "Meer" afwezig — haal 'm dan hier weg of zet de module aan.
#
# Nog kalibreren tegen een build met `maestro studio` (zie .maestro/README.md):
# vooral of "Meer" de module opent en `back` netjes terugkeert.
appId: app.huishoek
---
# Géén launchApp: dat opent de dev-client-launcher i.p.v. de JS-bundle. De runner
# (npm run rooktest) / `npm run device` cold-laadt de app; de eerste tapOn wacht de load af.

# --- Primaire tabs (in de balk) ---
- tapOn:
    id: "t-tab-vandaag"
- assertNotVisible:
    id: "t-error-boundary"

- tapOn:
    id: "t-tab-taken"
- assertVisible: "Taken"
- assertNotVisible:
    id: "t-error-boundary"

- tapOn:
    id: "t-tab-boodschappen"
- assertNotVisible:
    id: "t-error-boundary"

# --- Overige modules via de "Meer"-tab ---
# Per module: open Meer → tik de module → assert geen fout. We heropenen Meer telkens
# (t-tab-meer) i.p.v. op `back` te leunen, zodat backBehavior=history de sweep niet
# onverwacht ergens anders laat landen.
- tapOn:
    id: "t-tab-meer"
- tapOn: "Kosten"
- assertNotVisible:
    id: "t-error-boundary"

